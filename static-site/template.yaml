AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Static website for an ATU student. A Lambda function writes the page into a
  private, encrypted S3 bucket, and Amazon CloudFront serves it over HTTPS.

Parameters:
  StudentName:
    Type: String
    Default: Maxamed Maxamed
    Description: Full name shown in the page header
    AllowedPattern: '^[A-Za-z ]{1,60}$'
    ConstraintDescription: Letters and spaces only, up to 60 characters
  StudentNumber:
    Type: String
    Default: L00213552
    Description: ATU L number shown in the page header
    AllowedPattern: '^L[0-9]{8}$'
    ConstraintDescription: Must be the letter L followed by 8 digits

Resources:
  # Private bucket that stores the site content.
  # All public access is blocked, so only CloudFront can read it.
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      # Encrypt every object at rest with S3 managed keys.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Turn off ACLs so access is controlled only by the bucket policy.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Keep earlier versions of each file so a bad upload can be rolled back.
      VersioningConfiguration:
        Status: Enabled

  # Lets CloudFront sign its requests to the private bucket.
  WebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: Allows CloudFront to read the private website bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Public facing web service. Serves the site over HTTPS and caches it
  # at edge locations close to visitors.
  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Static website for ${AWS::StackName}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # Edge locations in North America and Europe only, the lowest cost option.
        PriceClass: PriceClass_100
        Origins:
          - Id: WebsiteBucketOrigin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebsiteOriginAccessControl.Id
            # Must be left empty when using Origin Access Control.
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: WebsiteBucketOrigin
          # Any plain HTTP request is redirected to HTTPS.
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS managed cache policy: CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # AWS managed response headers policy: SecurityHeadersPolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  # Only this CloudFront distribution may read objects, and only over HTTPS.
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt WebsiteBucket.Arn
              - !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Log group for the content writer function, kept for 14 days to limit cost.
  ContentWriterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-content-writer"
      RetentionInDays: 14

  # Least privilege role for the function. It can only write its own logs,
  # manage objects in this bucket and clear this distribution's cache.
  ContentWriterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: content-writer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ContentWriterLogGroup.Arn
              - Sid: ManageSiteObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub "${WebsiteBucket.Arn}/*"
              - Sid: ListSiteVersions
                Effect: Allow
                Action: s3:ListBucketVersions
                Resource: !GetAtt WebsiteBucket.Arn
              - Sid: ClearCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}"

  # Writes index.html on create and update, and empties the bucket on delete
  # so the whole stack can be removed cleanly.
  ContentWriterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Writes the website page into S3 during deployment
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt ContentWriterRole.Arn
      Timeout: 60
      MemorySize: 128
      LoggingConfig:
        LogGroup: !Ref ContentWriterLogGroup
      Code:
        ZipFile: |
          import html
          import time

          import boto3
          import cfnresponse

          s3 = boto3.client("s3")
          cloudfront = boto3.client("cloudfront")

          PAGE = """<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>CloudFormation Lab | {number}</title>
          </head>
          <body>
            <header>
              <h1>{number} {name}</h1>
            </header>
            <main>
              <p>Static website stored in Amazon S3, served through Amazon CloudFront
              and deployed with AWS CloudFormation.</p>
              <p>This page was written by a Lambda function during deployment.</p>
            </main>
          </body>
          </html>
          """


          def write_page(props):
              """Build the page from the stack parameters and upload it."""
              body = PAGE.format(
                  number=html.escape(props["StudentNumber"]),
                  name=html.escape(props["StudentName"]),
              )
              s3.put_object(
                  Bucket=props["BucketName"],
                  Key="index.html",
                  Body=body.encode("utf-8"),
                  ContentType="text/html; charset=utf-8",
              )
              # Clear the CloudFront cache so visitors see the new page straight away.
              cloudfront.create_invalidation(
                  DistributionId=props["DistributionId"],
                  InvalidationBatch={
                      "Paths": {"Quantity": 1, "Items": ["/*"]},
                      "CallerReference": str(time.time()),
                  },
              )


          def empty_bucket(bucket):
              """Delete every object version so CloudFormation can remove the bucket."""
              paginator = s3.get_paginator("list_object_versions")
              for page in paginator.paginate(Bucket=bucket):
                  items = page.get("Versions", []) + page.get("DeleteMarkers", [])
                  objects = [{"Key": i["Key"], "VersionId": i["VersionId"]} for i in items]
                  if objects:
                      s3.delete_objects(Bucket=bucket, Delete={"Objects": objects})


          def handler(event, context):
              props = event["ResourceProperties"]
              physical_id = props["BucketName"] + "/index.html"
              try:
                  if event["RequestType"] in ("Create", "Update"):
                      write_page(props)
                  elif event["RequestType"] == "Delete":
                      empty_bucket(props["BucketName"])
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)
              except Exception as error:
                  # Always reply, otherwise the stack waits up to an hour for a response.
                  print(f"Failed: {error}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, physical_id)

  # Custom resource that runs the function. Changing a parameter triggers
  # an update, which rewrites the page.
  SiteContent:
    Type: Custom::SiteContent
    Properties:
      ServiceToken: !GetAtt ContentWriterFunction.Arn
      BucketName: !Ref WebsiteBucket
      DistributionId: !Ref WebsiteDistribution
      StudentName: !Ref StudentName
      StudentNumber: !Ref StudentNumber

Outputs:
  WebsiteURL:
    Description: HTTPS address of the website through CloudFront
    Value: !Sub "https://${WebsiteDistribution.DomainName}"
  DistributionId:
    Description: CloudFront distribution ID, needed to clear the cache after updates
    Value: !Ref WebsiteDistribution
  BucketName:
    Description: Name of the private bucket that holds the site content
    Value: !Ref WebsiteBucket