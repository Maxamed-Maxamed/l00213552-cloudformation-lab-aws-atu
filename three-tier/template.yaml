AWSTemplateFormatVersion: "2010-09-09"
# This file is an AWS CloudFormation template. CloudFormation reads the
# sections below and creates the infrastructure in the order required by each
# resource reference, so the whole three-tier environment can be deployed or
# removed as one stack.
#
# Architecture overview:
# 1. The VPC contains public, private web, private application, and isolated
#    database subnets across two Availability Zones.
# 2. Internet users reach the public Application Load Balancer (ALB), which
#    forwards requests to the web Auto Scaling Group.
# 3. The web tier forwards /api/ requests to the private internal ALB.
# 4. The internal ALB forwards requests to the application Auto Scaling Group,
#    which reads and updates data in the private Amazon RDS database.
# Lines beginning with "#" are comments for people and are ignored by AWS.
Description: >
  Three tier architecture for L00213552 Maxamed Maxamed. A VPC across two
  availability zones with a web tier behind a public load balancer, an
  application tier behind an internal load balancer, and a MySQL database
  tier in isolated subnets.

Parameters:
  # Deployment inputs let the same template be reused with different
  # networks, student details, instance sizes, or Amazon Linux AMI versions.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: Address range for the VPC, split into eight /24 subnets
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/16$'
    ConstraintDescription: Must be a /16 range, for example 10.0.0.0/16
  StudentName:
    Type: String
    Default: Maxamed Maxamed
    Description: Full name shown in the page header
    AllowedPattern: '^[A-Za-z ]{1,60}$'
    ConstraintDescription: Letters and spaces only, up to 60 characters
  StudentNumber:
    Type: String
    Default: L00213552
    Description: ATU L number shown in the page header
    AllowedPattern: '^L[0-9]{8}$'
    ConstraintDescription: Must be the letter L followed by 8 digits
  WebInstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the web servers
    AllowedValues:
      - t3.micro
      - t3.small
  AppInstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the application servers
    AllowedValues:
      - t3.micro
      - t3.small
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: RDS instance class for the MySQL database
    AllowedValues:
      - db.t4g.micro
      - db.t3.micro
      - db.t4g.small
  DatabaseMultiAz:
    Type: String
    Default: "false"
    Description: >
      true keeps a standby copy of the database in the second zone with
      automatic failover. It doubles the database cost and takes longer to create.
    AllowedValues:
      - "true"
      - "false"
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 image, looked up from AWS at deploy time

Resources:
  # ---------- VPC and internet access ----------

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      # Creates the isolated network that contains all four tiers.
      CidrBlock: !Ref VpcCidr
      # DNS is required for instance metadata names and load balancer DNS names.
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      # Attaches the internet gateway to this VPC so public routes can use it.
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ---------- Subnets: two per tier, one in each availability zone ----------
  # Fn::Cidr splits the VPC range into eight /24 blocks, so no addresses
  # are typed by hand and they can never overlap.

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      # Selects the first availability zone returned for the deployment region.
      AvailabilityZone: !Select [0, !GetAZs ""]
      # Selects the first of eight non-overlapping /24 subnet ranges.
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 8, 8]]
      # Nothing launched here gets a public IP automatically.
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-a"

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      # The second zone keeps the public entry point available if one zone fails.
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-b"

  WebSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      # Web servers stay private; only the public load balancer is internet-facing.
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 8, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-web-a"

  WebSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 8, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-web-b"

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      # Application instances are isolated from direct internet traffic.
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 8, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-a"

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 8, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-b"

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      # Reserved for the data tier, with no default route to the internet.
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [6, !Cidr [!Ref VpcCidr, 8, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-database-a"

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [7, !Cidr [!Ref VpcCidr, 8, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-database-b"

  # ---------- NAT gateway ----------
  # Lets private servers download updates without being reachable from
  # the internet. One gateway instead of one per zone, to keep cost down.

  NatGatewayEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-eip"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      # The NAT gateway has a public address but is used only for outbound
      # connections from private web and application subnets.
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat"

  # ---------- Route tables ----------

  # Public: direct route to the internet through the internet gateway.
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      # Sends internet-bound traffic to the attached internet gateway.
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Private (web and app tiers): outbound only, through the NAT gateway.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      # Allows private instances to download updates without accepting inbound
      # connections from the internet.
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  WebSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WebSubnetA
      RouteTableId: !Ref PrivateRouteTable

  WebSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WebSubnetB
      RouteTableId: !Ref PrivateRouteTable

  AppSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      RouteTableId: !Ref PrivateRouteTable

  AppSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # Database: no route to the internet at all, in either direction.
  DatabaseRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-database-rt"

  DatabaseSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DatabaseSubnetA
      RouteTableId: !Ref DatabaseRouteTable

  DatabaseSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DatabaseSubnetB
      RouteTableId: !Ref DatabaseRouteTable

  # Free gateway endpoint: S3 traffic from private servers, including
  # Amazon Linux package downloads, stays on the AWS network and skips
  # the NAT gateway's data charges.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      # Keeps S3 traffic on AWS networking instead of sending it through NAT.
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # ---------- Web tier: security groups ----------

  # The only thing in the whole VPC that accepts traffic from the internet.
  WebLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public load balancer, accepts HTTP from the internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # This is the single internet entry point for the web tier.
        - Description: HTTP from anywhere
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-web-alb-sg"

  # Web servers accept HTTP only from the load balancer, never directly
  # from the internet. There is no SSH rule, because Session Manager is
  # used instead.
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web servers, accept HTTP only from the public load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # Referencing the load balancer SG allows only load balancer traffic,
        # regardless of the load balancer's changing private IP addresses.
        - Description: HTTP from the public load balancer only
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref WebLoadBalancerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-web-server-sg"

  # ---------- Web tier: server permissions ----------

  # Lets the servers register with Session Manager, so an administrator
  # can open a shell from the console without SSH keys or an open port.
  WebInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        # Allows EC2 to assume this role when the instance starts.
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Enables Systems Manager access without opening SSH to the internet.
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"

  WebInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WebInstanceRole

  # ---------- Web tier: server blueprint ----------

  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-web"
      LaunchTemplateData:
        # Defines the AMI, size, permissions, networking, and startup script
        # used whenever the web Auto Scaling group launches an instance.
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref WebInstanceType
        IamInstanceProfile:
          Arn: !GetAtt WebInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref WebServerSecurityGroup
        # IMDSv2 only: blocks a common way of stealing instance credentials.
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        # Encrypted root disk.
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Runs once at first boot. Installs the web server, writes the page
            # and tells CloudFormation this server is ready.
            set -euxo pipefail

            dnf install -y aws-cfn-bootstrap
            # If any later step fails, report it straight away instead of
            # leaving the stack waiting for the timeout.
            trap '/opt/aws/bin/cfn-signal --exit-code 1 --stack ${AWS::StackName} --resource WebAutoScalingGroup --region ${AWS::Region}' ERR

            dnf install -y httpd

            # IMDSv2: get a session token first, then read the server details.
            TOKEN=$(curl -sS -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            INSTANCE_ID=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            AZ=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)

            cat > /var/www/html/index.html <<EOF
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Three Tier Lab | ${StudentNumber}</title>
            </head>
            <body>
              <header>
                <h1>${StudentNumber} ${StudentName}</h1>
              </header>
              <main>
                <p>Three tier architecture deployed with AWS CloudFormation.</p>
                <h2>Web tier</h2>
                <p>Served by instance $INSTANCE_ID in $AZ.</p>
                <h2>Application tier</h2>
                <p id="app">Checking the application tier...</p>
                <h2>Database tier</h2>
                <p id="db">Checking the database tier...</p>
              </main>
              <script>
                fetch("/api/info")
                  .then(function (response) {
                    if (!response.ok) { throw new Error(response.status); }
                    return response.json();
                  })
                  .then(function (data) {
                    document.getElementById("app").textContent =
                      "Answered by instance " + data.instance + " in " + data.zone + ".";
                    var db = data.database || {};
                    document.getElementById("db").textContent = db.status === "connected"
                      ? "Connected to " + db.engine + ". This page has been viewed " + db.visits + " times."
                      : "The database tier is not available.";
                  })
                  .catch(function () {
                    document.getElementById("app").textContent =
                      "The application tier did not respond.";
                    document.getElementById("db").textContent =
                      "Unknown, because the application tier did not respond.";
                  });
              </script>
            </body>
            </html>
            EOF

            # Page the load balancer checks to decide whether this server is healthy.
            echo "ok" > /var/www/html/health

            # Pass every request under /api/ to the internal application load
            # balancer. The browser never talks to the application tier directly.
            cat > /etc/httpd/conf.d/app-proxy.conf <<EOF
            ProxyPass "/api/" "http://${AppLoadBalancer.DNSName}/api/"
            ProxyPassReverse "/api/" "http://${AppLoadBalancer.DNSName}/api/"
            EOF

            systemctl enable --now httpd

            /opt/aws/bin/cfn-signal --exit-code 0 --stack ${AWS::StackName} --resource WebAutoScalingGroup --region ${AWS::Region}

  # ---------- Web tier: load balancer ----------

  # Public facing entry point, spread across both public subnets.
  WebLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: InternetGatewayAttachment
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref WebLoadBalancerSecurityGroup
      LoadBalancerAttributes:
        # Rejects requests with malformed headers, a protection against
        # request smuggling attacks.
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-web-alb"

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      # Registers web instances and removes them from service when /health
      # does not return HTTP 200.
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        # Gives in-flight requests 30 seconds to finish when a server is removed.
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-web-tg"

  WebListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      # Forwards requests received on the public load balancer to healthy
      # instances in the web target group.
      LoadBalancerArn: !Ref WebLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  # ---------- Web tier: Auto Scaling ----------

  # Keeps between two and four web servers running across both zones and
  # replaces any server the load balancer reports as unhealthy.
  WebAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    # Servers need the NAT route to download packages at first boot.
    DependsOn: PrivateDefaultRoute
    # The stack only completes once both servers report they are ready.
    CreationPolicy:
      ResourceSignal:
        Count: 2
        Timeout: PT10M
    # Template changes replace servers one at a time, so the site stays up.
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT10M
        WaitOnResourceSignals: true
    Properties:
      VPCZoneIdentifier:
        - !Ref WebSubnetA
        - !Ref WebSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      MinSize: "2"
      MaxSize: "4"
      TargetGroupARNs:
        - !Ref WebTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-web"
          PropagateAtLaunch: true

  # Adds servers when average CPU goes above 50 percent and removes them
  # when it drops again.
  WebCpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      # Auto Scaling adjusts capacity to keep the group's average CPU near 50%.
      AutoScalingGroupName: !Ref WebAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 50

  # ---------- Application tier: security groups ----------

  # The internal load balancer accepts traffic only from the web servers.
  AppLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal load balancer, accepts HTTP only from the web servers
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # Only the web tier may call the internal application load balancer.
        - Description: HTTP from the web servers only
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref WebServerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-alb-sg"

  # Application servers accept traffic on port 8080 only from the internal
  # load balancer. No SSH rule, as on the web tier.
  AppServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application servers, accept port 8080 only from the internal load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # The application port is reachable only through the internal load
        # balancer, not from the web instances or the public network directly.
        - Description: Application port from the internal load balancer only
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AppLoadBalancerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-server-sg"

  # ---------- Application tier: server permissions ----------

  # Separate role from the web tier, so each tier can be given only the
  # permissions it needs. The database step adds access to the password here.
  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        # Allows the application EC2 instances to use this role.
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Provides Systems Manager access without requiring SSH.
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AppInstanceRole

  # ---------- Application tier: server blueprint ----------

  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    # New app servers must be allowed to read the database password.
    DependsOn: AppDatabaseSecretPolicy
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-app"
      LaunchTemplateData:
        # Defines the application instances that the application Auto Scaling
        # group creates in the private application subnets.
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref AppInstanceType
        IamInstanceProfile:
          Arn: !GetAtt AppInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref AppServerSecurityGroup
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Runs once at first boot. Installs a small Python API as a system
            # service and tells CloudFormation this server is ready.
            set -euxo pipefail

            dnf install -y aws-cfn-bootstrap
            trap '/opt/aws/bin/cfn-signal --exit-code 1 --stack ${AWS::StackName} --resource AppAutoScalingGroup --region ${AWS::Region}' ERR

            mkdir -p /opt/app

            # Isolated Python environment with pinned library versions, so every
            # server runs exactly the same code on the system Python 3.9.
            python3 -m venv /opt/app/venv
            /opt/app/venv/bin/pip install --quiet PyMySQL==1.1.1 boto3==1.35.99

            # Amazon RDS certificate bundle, used to check the database is the
            # real one before any password is sent.
            curl -sSf -o /opt/app/rds-ca.pem https://truststore.pki.rds.amazonaws.com/${AWS::Region}/${AWS::Region}-bundle.pem

            # Where to find the database. The password is not stored here: the
            # API reads it from Secrets Manager when it needs it.
            cat > /opt/app/config.json <<'EOF'
            {
              "host": "${Database.Endpoint.Address}",
              "port": ${Database.Endpoint.Port},
              "database": "labdb",
              "secret_arn": "${Database.MasterUserSecret.SecretArn}",
              "region": "${AWS::Region}",
              "ca_bundle": "/opt/app/rds-ca.pem"
            }
            EOF

            cat > /opt/app/app.py <<'EOF'
            """Application tier API. Reports which server answered and keeps a
            visit counter in the MySQL database on the database tier."""
            import json
            import urllib.request
            from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

            import boto3
            import pymysql

            IMDS = "http://169.254.169.254/latest"

            with open("/opt/app/config.json") as config_file:
                CONFIG = json.load(config_file)

            secrets = boto3.client("secretsmanager", region_name=CONFIG["region"])
            cached_login = None


            def metadata(path):
                """Read instance metadata using an IMDSv2 session token."""
                token_request = urllib.request.Request(
                    IMDS + "/api/token",
                    method="PUT",
                    headers={"X-aws-ec2-metadata-token-ttl-seconds": "300"},
                )
                token = urllib.request.urlopen(token_request, timeout=2).read().decode()
                request = urllib.request.Request(
                    IMDS + "/meta-data/" + path,
                    headers={"X-aws-ec2-metadata-token": token},
                )
                return urllib.request.urlopen(request, timeout=2).read().decode()


            INSTANCE_ID = metadata("instance-id")
            ZONE = metadata("placement/availability-zone")


            def login(refresh=False):
                """Read the database user and password from Secrets Manager.

                The result is cached. RDS can rotate the password, so a rejected
                login triggers one fresh read.
                """
                global cached_login
                if cached_login is None or refresh:
                    secret = secrets.get_secret_value(SecretId=CONFIG["secret_arn"])
                    cached_login = json.loads(secret["SecretString"])
                return cached_login


            def connect(refresh=False):
                """Open an encrypted connection that verifies the server certificate."""
                details = login(refresh)
                return pymysql.connect(
                    host=CONFIG["host"],
                    port=int(CONFIG["port"]),
                    user=details["username"],
                    password=details["password"],
                    database=CONFIG["database"],
                    connect_timeout=3,
                    autocommit=True,
                    ssl_ca=CONFIG["ca_bundle"],
                    ssl_verify_cert=True,
                    ssl_verify_identity=True,
                )


            def record_visit():
                """Add one to the shared visit counter and return the new total."""
                try:
                    try:
                        connection = connect()
                    except pymysql.err.OperationalError as error:
                        # 1045 means access denied, most likely after a password rotation.
                        if error.args[0] != 1045:
                            raise
                        connection = connect(refresh=True)
                    with connection:
                        with connection.cursor() as cursor:
                            cursor.execute(
                                "CREATE TABLE IF NOT EXISTS visits "
                                "(id INT PRIMARY KEY, total BIGINT NOT NULL)"
                            )
                            cursor.execute(
                                "INSERT INTO visits (id, total) VALUES (1, 1) "
                                "ON DUPLICATE KEY UPDATE total = total + 1"
                            )
                            cursor.execute("SELECT total FROM visits WHERE id = 1")
                            total = cursor.fetchone()[0]
                            cursor.execute("SELECT VERSION()")
                            version = cursor.fetchone()[0]
                    return {"status": "connected", "engine": "MySQL " + version, "visits": total}
                except Exception as error:
                    # Details go to the system journal; the page shows a simple message.
                    print("Database error:", repr(error), flush=True)
                    return {"status": "unavailable"}


            class Handler(BaseHTTPRequestHandler):
                def do_GET(self):
                    # /health deliberately does not touch the database. If it did, a
                    # database problem would make the load balancer mark every app
                    # server unhealthy, and Auto Scaling would replace them for nothing.
                    if self.path == "/health":
                        self.reply(200, {"status": "ok"})
                    elif self.path == "/api/info":
                        self.reply(200, {
                            "tier": "application",
                            "instance": INSTANCE_ID,
                            "zone": ZONE,
                            "database": record_visit(),
                        })
                    else:
                        self.reply(404, {"error": "not found"})

                def reply(self, status, body):
                    data = json.dumps(body).encode()
                    self.send_response(status)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(data)))
                    self.end_headers()
                    self.wfile.write(data)


            ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
            EOF

            # Run the API as a service under a throwaway system user, not root,
            # and restart it automatically if it ever stops.
            cat > /etc/systemd/system/app.service <<'EOF'
            [Unit]
            Description=Three tier lab application API
            After=network-online.target
            Wants=network-online.target

            [Service]
            ExecStart=/opt/app/venv/bin/python /opt/app/app.py
            DynamicUser=yes
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable --now app

            # Wait until the API answers before reporting ready.
            for attempt in $(seq 1 30); do
              curl -sf http://localhost:8080/health && break
              sleep 2
            done
            curl -sf http://localhost:8080/health

            /opt/aws/bin/cfn-signal --exit-code 0 --stack ${AWS::StackName} --resource AppAutoScalingGroup --region ${AWS::Region}

  # ---------- Application tier: internal load balancer ----------

  # Internal scheme: it only has private addresses, so nothing on the
  # internet can reach it.
  AppLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      # The internal scheme gives this load balancer private addresses only.
      Type: application
      Scheme: internal
      Subnets:
        - !Ref AppSubnetA
        - !Ref AppSubnetB
      SecurityGroups:
        - !Ref AppLoadBalancerSecurityGroup
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-alb"

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      # Sends requests to application instances on their Python API port.
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-tg"

  AppListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      # Routes internal load balancer requests to healthy application servers.
      LoadBalancerArn: !Ref AppLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  # ---------- Application tier: Auto Scaling ----------

  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: PrivateDefaultRoute
    CreationPolicy:
      ResourceSignal:
        Count: 2
        Timeout: PT10M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT10M
        WaitOnResourceSignals: true
    Properties:
      VPCZoneIdentifier:
        - !Ref AppSubnetA
        - !Ref AppSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      MinSize: "2"
      MaxSize: "4"
      TargetGroupARNs:
        - !Ref AppTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app"
          PropagateAtLaunch: true

  AppCpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      # Adds or removes application instances as average CPU changes.
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 50

  # ---------- Database tier ----------

  # The database accepts MySQL connections only from the application servers.
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database, accepts MySQL only from the application servers
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: MySQL from the application servers only
          IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppServerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-database-sg"

  # Tells RDS which subnets it may use: the isolated database subnets,
  # which have no route to the internet in either direction.
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated database subnets in two availability zones
      SubnetIds:
        - !Ref DatabaseSubnetA
        - !Ref DatabaseSubnetB
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-database-subnets"

  Database:
    Type: AWS::RDS::DBInstance
    # Lab data is disposable, so deleting the stack deletes the database
    # without a final snapshot. Production would use Snapshot for both.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    # cfn-lint only accepts exact versions such as 8.4.11. AWS documents that
    # a major version on its own is valid, and with automatic minor upgrades
    # it stops the template and the running database drifting apart.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3691
    Properties:
      Engine: mysql
      # MySQL 8.4 is in standard support until July 2029. RDS picks a
      # recent minor version and applies minor upgrades automatically.
      EngineVersion: "8.4"
      AutoMinorVersionUpgrade: true
      # Never move into paid Extended Support without a decision.
      EngineLifecycleSupport: open-source-rds-extended-support-disabled
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: labdb
      MasterUsername: labadmin
      # RDS generates the password and keeps it in Secrets Manager, so it
      # never appears in this template, the console or the logs.
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      MultiAZ: !Ref DatabaseMultiAz
      # Daily automated backups, kept for one day.
      BackupRetentionPeriod: 1
      DeleteAutomatedBackups: true
      CopyTagsToSnapshot: true
      # Off for the lab so the stack can be deleted at the end of each session.
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-database"

  # Lets the application servers read the database password, and nothing else.
  # The web servers have no access to it.
  AppDatabaseSecretPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref AppInstanceRole
      PolicyName: read-database-secret
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !GetAtt Database.MasterUserSecret.SecretArn

Outputs:
  # Stack outputs make the deployed network and entry-point addresses easy to
  # find after CloudFormation finishes creating the stack.
  VpcId:
    Description: ID of the three tier VPC
    Value: !Ref Vpc
  NatGatewayPublicIp:
    Description: Public IP that private servers use for outbound traffic
    Value: !Ref NatGatewayEip
  WebURL:
    Description: Address of the web tier through the public load balancer
    Value: !Sub "http://${WebLoadBalancer.DNSName}"
  AppLoadBalancerDns:
    Description: Private address of the internal application load balancer
    Value: !GetAtt AppLoadBalancer.DNSName
  DatabaseEndpoint:
    Description: Private address of the MySQL database
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Description: Secrets Manager secret that holds the database password
    Value: !GetAtt Database.MasterUserSecret.SecretArn